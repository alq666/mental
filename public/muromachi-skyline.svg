<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260" preserveAspectRatio="xMidYMax slice">
  <!-- Muromachi Kyoto: the Higashiyama hills, the five-storey pagoda of Toji,
       the Golden Pavilion (Kinkakuji) on its pond, and a temple gate. -->
  <path fill="#233a5c" fill-opacity=".09" d="M0 120L110 52L210 96L330 40L450 100L560 62L680 108L800 58L920 104L1040 70L1160 112L1280 66L1400 104L1500 84L1600 116V260H0Z"/>
  <path fill="#16253f" fill-opacity=".13" d="M0 170L140 120L280 156L420 112L560 160L700 126L840 168L980 130L1120 166L1260 128L1400 164L1530 140L1600 162V260H0Z"/>

  <g fill="#16253f" fill-opacity=".38">
    <!-- Five-storey pagoda: tapering storeys with corbelled eaves and a finial -->
    <g transform="translate(280 0)">
      <rect x="-76" y="234" width="152" height="10"/>
      <rect x="-40" y="206" width="80" height="28"/>
      <rect x="-70" y="194" width="140" height="9"/>
      <rect x="-36" y="162" width="72" height="32"/>
      <rect x="-64" y="154" width="128" height="8"/>
      <rect x="-32" y="122" width="64" height="32"/>
      <rect x="-58" y="114" width="116" height="8"/>
      <rect x="-28" y="84" width="56" height="30"/>
      <rect x="-52" y="76" width="104" height="8"/>
      <rect x="-2" y="56" width="4" height="20"/>
      <circle cx="0" cy="52" r="5"/><circle cx="0" cy="44" r="3"/>
    </g>
    <!-- Stone gate (sanmon) with hip roof and tie beam -->
    <g transform="translate(1380 0)">
      <rect x="-80" y="134" width="160" height="12"/>
      <polygon points="0,116 74,138 -74,138"/>
      <rect x="-64" y="138" width="128" height="28"/>
      <rect x="-64" y="150" width="12" height="96"/>
      <rect x="52" y="150" width="12" height="96"/>
      <rect x="-70" y="186" width="140" height="8"/>
    </g>
    <!-- Row of machiya roofs along the way -->
    <g transform="translate(1160 0)">
      <rect x="0" y="212" width="60" height="10"/>
      <rect x="66" y="204" width="70" height="12"/>
      <rect x="142" y="216" width="56" height="10"/>
      <rect x="204" y="206" width="64" height="12"/>
      <rect x="274" y="214" width="56" height="10"/>
      <rect x="336" y="206" width="60" height="12"/>
      <rect x="402" y="214" width="58" height="10"/>
    </g>
  </g>

  <!-- Kinkakuji, the Golden Pavilion, above its pond -->
  <g fill="#b18a3c" fill-opacity=".62">
    <polygon points="1040,30 1080,50 1000,50"/>
    <rect x="1018" y="48" width="44" height="16"/>
    <rect x="996" y="64" width="88" height="10"/>
    <rect x="1012" y="72" width="56" height="24"/>
    <rect x="980" y="96" width="120" height="10"/>
    <rect x="1000" y="104" width="80" height="36"/>
    <rect x="992" y="140" width="96" height="10"/>
  </g>
  <g fill="#16253f" fill-opacity=".38">
    <rect x="1038" y="20" width="4" height="12"/>
    <circle cx="1040" cy="18" r="4"/>
    <rect x="1000" y="148" width="8" height="6"/>
    <rect x="1072" y="148" width="8" height="6"/>
  </g>
  <rect x="952" y="158" width="176" height="4" rx="2" fill="#233a5c" fill-opacity=".16"/>
</svg>